<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil - DRYcycle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50">
    <!-- Navigasi -->
    <nav class="bg-white sticky top-0 z-50 flex items-center justify-between px-4 py-3 shadow-md">
        <div class="flex items-center space-x-3">
            <button onclick="window.history.back()"
                class="text-gray-700 hover:text-emerald-600 transition transform hover:scale-110">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
            <div>
                <h1 class="text-lg font-semibold text-gray-800 leading-tight">Edit Profil</h1>
                <p class="text-xs text-gray-500">Perbarui informasi Anda</p>
            </div>
        </div>

        <button id="saveBtn"
            class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-6 py-2 rounded-full transition">
            Simpan
        </button>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <!-- Cover Image Section -->
            <div class="relative">
                <div class="h-48 bg-gradient-to-r from-emerald-400 to-teal-500 relative">
                    <img id="coverPreview" src="assets/image/images/banner.png" alt="Cover"
                        class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-30 flex items-center justify-center">
                        <label for="coverInput"
                            class="cursor-pointer bg-white bg-opacity-90 hover:bg-opacity-100 text-gray-800 px-4 py-2 rounded-full transition flex items-center space-x-2">
                            <i class="fas fa-camera"></i>
                            <span>Ubah Cover</span>
                        </label>
                        <input type="file" id="coverInput" accept="image/*" class="hidden">
                    </div>
                </div>

                <!-- Profile Picture -->
                <div class="absolute -bottom-16 left-8">
                    <div class="relative">
                        <img id="profilePreview" src="assets/image/userprofile/user1.png" alt="Profile"
                            class="w-32 h-32 rounded-full border-4 border-white shadow-lg object-cover">
                        <label for="profileInput"
                            class="absolute bottom-0 right-0 bg-emerald-500 hover:bg-emerald-600 text-white w-10 h-10 rounded-full flex items-center justify-center cursor-pointer transition shadow-lg">
                            <i class="fas fa-camera"></i>
                        </label>
                        <input type="file" id="profileInput" accept="image/*" class="hidden">
                    </div>
                </div>
            </div>

            <!-- Form Section -->
            <div class="px-8 pt-20 pb-8">
                <form id="editProfileForm" class="space-y-6">
                    <!-- Nama Lengkap -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Nama Lengkap <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="fullName" value="Budi Santoso" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                    </div>

                    <!-- Username -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Username <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute left-4 top-3.5 text-gray-500">@</span>
                            <input type="text" id="username" value="budisnt" required
                                class="w-full pl-9 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                        </div>
                    </div>

                    <!-- Role/Title -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Role/Posisi
                        </label>
                        <input type="text" id="role" value="Eco Volunteer"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                    </div>

                    <!-- Bio -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Bio
                        </label>
                        <textarea id="bio" rows="4"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition resize-none">Saya adalah kontributor aktif DRYcycle yang berdedikasi dalam pengelolaan sampah berkelanjutan. Memiliki pengalaman luas dalam pemilahan sampah organik dan anorganik, serta aktif menyalurkan makanan surplus ke pihak yang membutuhkan. Bergabung sejak 2024 dengan misi membuat lingkungan lebih bersih dan berkelanjutan.</textarea>
                        <p class="text-xs text-gray-500 mt-1">Maksimal 500 karakter</p>
                    </div>

                    <!-- Tags/Expertise -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Keahlian/Tag
                        </label>
                        <div id="tagsContainer" class="flex flex-wrap gap-2 mb-3">
                            <span
                                class="tag-item bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm flex items-center space-x-2">
                                <span>Organik Expert</span>
                                <button type="button" onclick="removeTag(this)" class="hover:text-emerald-900">
                                    <i class="fas fa-times text-xs"></i>
                                </button>
                            </span>
                            <span
                                class="tag-item bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm flex items-center space-x-2">
                                <span>Plastik Recycler</span>
                                <button type="button" onclick="removeTag(this)" class="hover:text-emerald-900">
                                    <i class="fas fa-times text-xs"></i>
                                </button>
                            </span>
                            <span
                                class="tag-item bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm flex items-center space-x-2">
                                <span>Food Savior</span>
                                <button type="button" onclick="removeTag(this)" class="hover:text-emerald-900">
                                    <i class="fas fa-times text-xs"></i>
                                </button>
                            </span>
                        </div>
                        <div class="flex space-x-2">
                            <input type="text" id="newTag" placeholder="Tambah tag baru..."
                                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                            <button type="button" onclick="addTag()"
                                class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg transition">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Email
                        </label>
                        <input type="email" id="email" value="budi.santoso@email.com"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                    </div>

                    <!-- Lokasi -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Lokasi
                        </label>
                        <input type="text" id="location" value="Bekasi, Jawa Barat"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                    </div>

                    <!-- Social Media -->
                    <div class="border-t pt-6">
                        <h3 class="text-lg font-bold text-gray-800 mb-4">Media Sosial</h3>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">
                                    <i class="fab fa-instagram text-pink-500 mr-2"></i>Instagram
                                </label>
                                <input type="text" id="instagram" placeholder="@username"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">
                                    <i class="fab fa-twitter text-blue-400 mr-2"></i>Twitter
                                </label>
                                <input type="text" id="twitter" placeholder="@username"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">
                                    <i class="fab fa-linkedin text-blue-600 mr-2"></i>LinkedIn
                                </label>
                                <input type="text" id="linkedin" placeholder="linkedin.com/in/username"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex space-x-4 pt-6 border-t">
                        <button type="button" onclick="window.history.back()"
                            class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-3 rounded-lg transition">
                            Batal
                        </button>
                        <button type="submit"
                            class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3 rounded-lg transition">
                            Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full transform transition-all">
            <div class="text-center">
                <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check text-3xl text-emerald-500"></i>
                </div>
                <h3 class="text-2xl font-bold text-gray-800 mb-2">Berhasil!</h3>
                <p class="text-gray-600 mb-6">Profil Anda telah berhasil diperbarui</p>
                <button onclick="closeModal()"
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3 rounded-lg transition">
                    OK
                </button>
            </div>
        </div>
    </div>

    <script>
        // Preview Cover Image
        document.getElementById('coverInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('coverPreview').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Preview Profile Image
        document.getElementById('profileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('profilePreview').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Add Tag
        function addTag() {
            const input = document.getElementById('newTag');
            const tagText = input.value.trim();

            if (tagText) {
                const tagsContainer = document.getElementById('tagsContainer');
                const newTag = document.createElement('span');
                newTag.className = 'tag-item bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm flex items-center space-x-2';
                newTag.innerHTML = `
                    <span>${tagText}</span>
                    <button type="button" onclick="removeTag(this)" class="hover:text-emerald-900">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                `;
                tagsContainer.appendChild(newTag);
                input.value = '';
            }
        }

        // Remove Tag
        function removeTag(button) {
            button.closest('.tag-item').remove();
        }

        // Add tag on Enter key
        document.getElementById('newTag').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTag();
            }
        });

        // Form Submit
        document.getElementById('editProfileForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Collect form data
            const formData = {
                fullName: document.getElementById('fullName').value,
                username: document.getElementById('username').value,
                role: document.getElementById('role').value,
                bio: document.getElementById('bio').value,
                email: document.getElementById('email').value,
                location: document.getElementById('location').value,
                instagram: document.getElementById('instagram').value,
                twitter: document.getElementById('twitter').value,
                linkedin: document.getElementById('linkedin').value,
                tags: Array.from(document.querySelectorAll('.tag-item span:first-child')).map(span => span.textContent)
            };

            console.log('Form Data:', formData);

            // Show success modal
            document.getElementById('successModal').classList.remove('hidden');

            // Save to localStorage for demo
            localStorage.setItem('userProfile', JSON.stringify(formData));
        });

        // Save button in navbar
        document.getElementById('saveBtn').addEventListener('click', function () {
            document.getElementById('editProfileForm').requestSubmit();
        });

        // Close Modal
        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
            // Redirect back to profile page
            setTimeout(() => {
                window.history.back();
            }, 300);
        }

        // Character counter for bio
        const bioTextarea = document.getElementById('bio');
        bioTextarea.addEventListener('input', function () {
            const maxLength = 500;
            const currentLength = this.value.length;
            const remaining = maxLength - currentLength;

            if (currentLength > maxLength) {
                this.value = this.value.substring(0, maxLength);
            }
        });
    </script>
</body>

</html>

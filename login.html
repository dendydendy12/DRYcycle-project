<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DRYcycle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slideInUp {
      from {
        transform: translateY(100px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes checkmark {
      0% {
        stroke-dashoffset: 100;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .modal-overlay {
      animation: fadeIn 0.3s ease-out;
    }

    .modal-content {
      animation: scaleIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .success-checkmark {
      stroke-dasharray: 100;
      animation: checkmark 0.6s ease-in-out 0.3s forwards;
    }

    .pulse-animation {
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
</head>

<body class="gradient-bg bg-white min-h-screen">

  <div class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="max-w-6xl w-full grid md:grid-cols-2 gap-0 bg-white rounded-3xl overflow-hidden shadow-xl">

      <!-- Login Form -->
      <div class="p-8 md:p-12 flex flex-col justify-center">
        <div class="mb-8">
          <div class="flex items-center gap-3 mb-4">
            <img src="assets/image/logo/logo.png" class="w-10 h-10" alt="Logo DRYcycle"
              onerror="this.style.display='none';">
            <h1 class="text-3xl font-bold text-gray-900">DRYcycle</h1>
          </div>
          <h2 class="text-4xl font-bold text-gray-900 mb-3">Welcome back!</h2>
          <p class="text-gray-600">
            Simplify your waste management and boost your environmental impact with
            <span class="font-semibold">DRYcycle</span>. Get started for free.
          </p>
        </div>

        <form class="space-y-5" onsubmit="handleLogin(event)">
          <div>
            <input type="text" placeholder="Username"
              class="w-full px-5 py-4 border-2 border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
              required>
          </div>

          <div class="relative">
            <input type="password" id="password" placeholder="Password"
              class="w-full px-5 py-4 border-2 border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
              required>
            <button type="button" onclick="togglePassword()"
              class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
            </button>
          </div>

          <div class="text-right">
            <a href="#" class="text-sm text-gray-700 hover:text-gray-900">Forgot Password?</a>
          </div>

          <button type="submit"
            class="w-full bg-green-600 text-white py-4 rounded-full hover:bg-green-700 transition font-semibold text-base transform hover:scale-105 duration-200">
            Login
          </button>
        </form>

        <div class="mt-6">
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-4 bg-white text-gray-500">or continue with</span>
            </div>
          </div>

          <div class="mt-6 flex justify-center gap-4">
            <button
              class="w-14 h-14 bg-gray-900 text-white rounded-full flex items-center justify-center hover:bg-gray-800 transition transform hover:scale-110 duration-200">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
              </svg>
            </button>

            <button
              class="w-14 h-14 bg-gray-900 text-white rounded-full flex items-center justify-center hover:bg-gray-800 transition transform hover:scale-110 duration-200">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
              </svg>
            </button>

            <button
              class="w-14 h-14 bg-gray-900 text-white rounded-full flex items-center justify-center hover:bg-gray-800 transition transform hover:scale-110 duration-200">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="mt-8 text-center">
          <p class="text-gray-600">
            Not a member?
            <a href="daftar.html" class="text-green-600 hover:text-green-700 font-semibold">Register now</a>
          </p>
        </div>
      </div>

      <!-- Right Side - Image Illustration -->
      <div class="hidden md:flex items-center justify-center bg-white">
        <img src="assets/image/images/ear.png" alt="Register Illustration" class="max-w-full h-auto object-contain"
          onerror="this.style.display='none';" />
      </div>

    </div>
  </div>

  <!-- Custom Success Modal -->
  <div id="successModal" class="fixed inset-0 z-50 hidden">
    <!-- Overlay -->
    <div class="modal-overlay absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm"></div>

    <!-- Modal Content -->
    <div class="relative min-h-screen flex items-center justify-center p-4">
      <div class="modal-content bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 relative">
        <!-- Close Button -->
        <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>

        <!-- Success Icon -->
        <div class="flex justify-center mb-6">
          <div class="relative">
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center pulse-animation">
              <svg class="w-16 h-16" viewBox="0 0 52 52">
                <circle class="text-green-500" cx="26" cy="26" r="25" fill="none" stroke="currentColor"
                  stroke-width="2" />
                <path class="success-checkmark text-green-500" fill="none" stroke="currentColor" stroke-width="3"
                  stroke-linecap="round" d="M14 27l7 7 16-16" />
              </svg>
            </div>
          </div>
        </div>

        <!-- Success Message -->
        <div class="text-center">
          <h3 class="text-2xl font-bold text-gray-900 mb-3">Login Berhasil!</h3>
          <p class="text-gray-600 mb-6">
            Selamat datang kembali di DRYcycle. Anda akan diarahkan ke dashboard dalam beberapa saat.
          </p>

          <!-- Progress Bar -->
          <div class="w-full bg-gray-200 rounded-full h-2 mb-6 overflow-hidden">
            <div id="progressBar" class="bg-green-500 h-2 rounded-full transition-all duration-300" style="width: 0%">
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex gap-3">
            <button onclick="closeModal()"
              class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-full hover:bg-gray-50 transition font-semibold">
              Tutup
            </button>
            <button onclick="redirectToDashboard()"
              class="flex-1 px-6 py-3 bg-green-600 text-white rounded-full hover:bg-green-700 transition font-semibold">
              Lanjutkan
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let progressInterval;

    function handleLogin(event) {
      event.preventDefault();
      showSuccessModal();
    }

    function showSuccessModal() {
      const modal = document.getElementById('successModal');
      modal.classList.remove('hidden');

      // Start progress bar animation
      let progress = 0;
      const progressBar = document.getElementById('progressBar');

      progressInterval = setInterval(() => {
        progress += 2;
        progressBar.style.width = progress + '%';

        if (progress >= 100) {
          clearInterval(progressInterval);
          setTimeout(() => {
            redirectToDashboard();
          }, 300);
        }
      }, 60);
    }

    function closeModal() {
      const modal = document.getElementById('successModal');
      modal.classList.add('hidden');
      clearInterval(progressInterval);
      document.getElementById('progressBar').style.width = '0%';
    }

    function redirectToDashboard() {
      clearInterval(progressInterval);
      window.location.href = 'dashboard.html';
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    // Close modal when clicking outside
    document.getElementById('successModal')?.addEventListener('click', function (e) {
      if (e.target === this) {
        closeModal();
      }
    });
  </script>

</body>

</html>

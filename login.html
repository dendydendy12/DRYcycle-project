<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DRYcycle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }

        .illustration-card {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d1d5db;
            transition: all 0.3s;
        }

        .dot.active {
            background: #1f2937;
            width: 24px;
            border-radius: 4px;
        }
    </style>
</head>

<body class="gradient-bg min-h-screen">

    <div class="min-h-screen flex items-center justify-center px-6 py-12">
        <div class="max-w-6xl w-full grid md:grid-cols-2 gap-0 bg-white rounded-3xl shadow-2xl overflow-hidden">

            <!-- Left Side - Login Form -->
            <div class="p-8 md:p-12 flex flex-col justify-center">
                <div class="mb-8">
                    <h2 class="text-4xl font-bold text-gray-900 mb-3">Welcome back!</h2>
                    <p class="text-gray-600">Simplify your workflow and boost your productivity with <span class="font-semibold">Tuga's App</span>. Get started for free.</p>
                </div>

                <form class="space-y-5" onsubmit="handleLogin(event)">
                    <div>
                        <input type="text" placeholder="Username"
                            class="w-full px-5 py-4 border-2 border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent transition"
                            required>
                    </div>

                    <div class="relative">
                        <input type="password" id="password" placeholder="Password"
                            class="w-full px-5 py-4 border-2 border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent transition"
                            required>
                        <button type="button" onclick="togglePassword()" class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="text-right">
                        <a href="#" class="text-sm text-gray-700 hover:text-gray-900">Forgot Password?</a>
                    </div>

                    <button type="submit"
                        class="w-full bg-black text-white py-4 rounded-full hover:bg-gray-800 transition font-semibold text-base">
                        Login
                    </button>
                </form>

                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-4 bg-white text-gray-500">or continue with</span>
                        </div>
                    </div>

                    <div class="mt-6 flex justify-center gap-4">
                        <button
                            class="w-14 h-14 bg-black text-white rounded-full flex items-center justify-center hover:bg-gray-800 transition">
                            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                            </svg>
                        </button>

                        <button
                            class="w-14 h-14 bg-black text-white rounded-full flex items-center justify-center hover:bg-gray-800 transition">
                            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                            </svg>
                        </button>

                        <button
                            class="w-14 h-14 bg-black text-white rounded-full flex items-center justify-center hover:bg-gray-800 transition">
                            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="mt-8 text-center">
                    <p class="text-gray-600">
                        Not a member?
                        <a href="#" class="text-gray-900 hover:text-gray-700 font-semibold">Register now</a>
                    </p>
                </div>
            </div>

            <!-- Right Side - Illustration -->
            <div class="illustration-card hidden md:flex flex-col items-center justify-center p-12 text-white relative overflow-hidden">
                <!-- Decorative circles -->
                <div class="absolute top-10 left-10 w-20 h-20 bg-white/10 rounded-full"></div>
                <div class="absolute bottom-10 right-10 w-32 h-32 bg-white/10 rounded-full"></div>
                
                <!-- Main illustration -->
                <div class="relative z-10 text-center mb-8">
                    <!-- Avatar circles -->
                    <div class="flex justify-center mb-8 relative">
                        <div class="absolute left-0 w-16 h-16 bg-white rounded-full overflow-hidden border-4 border-emerald-600 shadow-lg">
                            <svg viewBox="0 0 100 100" class="w-full h-full">
                                <circle cx="50" cy="40" r="18" fill="#4B5563"/>
                                <circle cx="50" cy="75" r="25" fill="#4B5563"/>
                            </svg>
                        </div>
                        <div class="absolute right-0 w-16 h-16 bg-white rounded-full overflow-hidden border-4 border-emerald-600 shadow-lg">
                            <svg viewBox="0 0 100 100" class="w-full h-full">
                                <circle cx="50" cy="40" r="18" fill="#4B5563"/>
                                <circle cx="50" cy="75" r="25" fill="#4B5563"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Main character -->
                    <div class="mb-8">
                        <svg viewBox="0 0 200 200" class="w-64 h-64 mx-auto">
                            <!-- Body -->
                            <ellipse cx="100" cy="140" rx="45" ry="50" fill="white"/>
                            <!-- Shirt with heart -->
                            <path d="M 70 110 Q 100 100 130 110 L 130 150 Q 100 160 70 150 Z" fill="#10b981"/>
                            <path d="M 100 120 Q 105 115 110 120 Q 110 130 100 135 Q 90 130 90 120 Q 95 115 100 120 Z" fill="white"/>
                            <!-- Head -->
                            <circle cx="100" cy="70" r="30" fill="#f5deb3"/>
                            <!-- Hair -->
                            <path d="M 70 60 Q 75 40 100 45 Q 125 40 130 60 Q 130 80 100 85 Q 70 80 70 60 Z" fill="#2d3748"/>
                            <!-- Eyes -->
                            <circle cx="90" cy="70" r="3" fill="#2d3748"/>
                            <circle cx="110" cy="70" r="3" fill="#2d3748"/>
                            <!-- Smile -->
                            <path d="M 90 80 Q 100 85 110 80" stroke="#2d3748" stroke-width="2" fill="none"/>
                            <!-- Arms in meditation pose -->
                            <ellipse cx="65" cy="120" rx="15" ry="8" fill="#f5deb3" transform="rotate(-30 65 120)"/>
                            <ellipse cx="135" cy="120" rx="15" ry="8" fill="#f5deb3" transform="rotate(30 135 120)"/>
                            <!-- Hands -->
                            <circle cx="60" cy="125" r="8" fill="#f5deb3"/>
                            <circle cx="140" cy="125" r="8" fill="#f5deb3"/>
                            <!-- Decorative vine -->
                            <path d="M 80 50 Q 70 40 75 35 Q 80 40 85 35 Q 90 40 95 35" stroke="#10b981" stroke-width="2" fill="none" opacity="0.6"/>
                        </svg>
                    </div>

                    <!-- Task card -->
                    <div class="bg-white text-gray-900 rounded-2xl p-5 shadow-xl inline-block mb-6">
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <h3 class="font-bold text-lg">Canva Design</h3>
                                <p class="text-sm text-gray-500">10 Task</p>
                            </div>
                            <div class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-bold">
                                84%
                            </div>
                        </div>
                        <span class="inline-block bg-gray-100 text-gray-700 px-4 py-1 rounded-full text-sm">Design</span>
                    </div>

                    <!-- Pagination dots -->
                    <div class="flex justify-center gap-2">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot active"></div>
                    </div>
                </div>

                <div class="relative z-10 text-center">
                    <h3 class="text-2xl font-bold mb-3">Make your work easier and organized</h3>
                    <p class="text-lg">with <span class="font-bold">Tuga's App</span></p>
                </div>
            </div>

        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            // Simulate login - in real app, this would call an API
            alert('Login berhasil! Redirecting to dashboard...');
            // Redirect to dashboard (you would create dashboard.html)
            window.location.href = 'dashboard.html';
        }

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }
    </script>

</body>

</html>
